{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
<p class="muted">Enter a username. New usernames are created automatically — no password.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <label>Username
    <input type="text" name="username" autofocus required>
  </label>
  <button type="submit">Continue</button>
</form>
{% endblock %}
