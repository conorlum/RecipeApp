{% extends "base.html" %}
{% block title %}Import from website{% endblock %}
{% block content %}
<p><a href="{{ url_for('recipes.list_recipes') }}">&laquo; Recipes</a></p>
<h1>Import from website</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <label>Recipe URL
    <input type="url" name="url" value="{{ url or '' }}" required autofocus>
  </label>
  <button type="submit">Fetch and parse</button>
</form>
{% endblock %}
