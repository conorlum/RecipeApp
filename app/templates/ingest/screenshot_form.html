{% extends "base.html" %}
{% block title %}Import from screenshot{% endblock %}
{% block content %}
<p><a href="{{ url_for('recipes.list_recipes') }}">&laquo; Recipes</a></p>
<h1>Import from screenshot</h1>
<p class="muted">Upload a screenshot of the post — Claude reads the on-screen text directly, no need to copy/paste.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" enctype="multipart/form-data">
  <label>Screenshot
    <input type="file" name="image" accept="image/*" required autofocus>
  </label>
  <label>Post URL (optional, just for reference)
    <input type="url" name="source_url">
  </label>
  <button type="submit">Parse</button>
</form>
{% endblock %}
